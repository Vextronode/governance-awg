# Status per kontrol (format: RFC-0001 M.3, schema: catalog/schema/status.schema.json)
# Wajib memuat tepat satu entri untuk setiap kontrol yang berlaku: semua BASE, MOD dari modul aktif, dan SYS lokal.
# Contoh di bawah hanya satu entri. Mode team: status verified hanya diisi verifikator di luar tim (framework 03).
# Mode solo (framework 09): verifikasi memakai role self_review / external_reviewer, dan implemented_at wajib
# untuk status implemented/verified. verifier_role: rotation | devops_coordinator | qa_coordinator |
# program_coordinator (team) | self_review | external_reviewer (solo; external_reviewer di team hanya dicatat).
awg_version: v2.1.0
system: SID
controls:
  - id: BASE-SEC-001
    status: not_started       # C.4
    implemented_at: null      # YYYY-MM-DD saat status menjadi implemented (wajib di solo)
    owner: ""
    evidence: []              # [{type: test, ref: "tests/Feature/AuthTest.php", note: ""}]
    waiver: null
    reason: null              # wajib untuk not_applicable
    verification: []          # E.2
    notes: ""

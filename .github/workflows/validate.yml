name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/awg-validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/awg-validate/package-lock.json

      - name: Install
        run: npm ci

      - name: Test validator
        run: npm test

      - name: Validasi katalog
        run: node awg-validate.mjs catalog --root ../..

      - name: GATE-MATRIX sinkron dengan katalog
        run: node awg-validate.mjs catalog --root ../.. --gate-matrix --check
